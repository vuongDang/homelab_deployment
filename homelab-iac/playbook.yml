  tasks:
    - name: Update apt and install dependencies
      apt:
        name: [curl, git, ca-certificates, gnupg]
        state: present
        update_cache: yes

    - name: Install Docker
      shell: curl -fsSL https://get.docker.com | sh
      args:
        creates: /usr/bin/docker

    - name: Ensure Docker is running
      service:
        name: docker
        state: started
        enabled: yes

    - name: Create boum directory
      file:
        path: /opt/boum
        state: directory
        mode: "0755"

    - name: Clone viva-padel repository
      git:
        repo: "https://github.com/vuongDang/viva-padel.git"
        dest: /opt/boum/viva-padel
        version: main
        force: yes
        update: yes

    - name: Ensure that padelgroup exits
      group:
        name: padelgroup
        gid: 1001
        state: present

    - name: Ensure that padeluser exists
      user:
        name: padeluser
        uid: 1001
        state: present
        group: padelgroup
        groups: docker # Allows the user to run docker commands
        append: yes

    - name: Create data directory for SQLite
      file:
        path: /opt/boum/viva-padel-data
        state: directory
        owner: 1001
        group: 1001
        mode: "0777" # Temporarily open to debug permission issues
        recurse: yes

    - name: Secure the .env file
      template:
        src: templates/env.j2
        dest: /opt/boum/viva-padel-data/.env
        owner: 1001
        group: 1001
        mode: "0644" # Secure the .env file

    - name: Install Docker Compose
      ansible.builtin.get_url:
        url: https://github.com/docker/compose/releases/download/v2.24.6/docker-compose-linux-x86_64
        dest: /usr/local/bin/docker-compose
        mode: "0755"

    - name: Deploy viva-padel server
      ansible.builtin.command: docker-compose up -d --build
      args:
        chdir: /opt/boum/viva-padel
      environment:
        # Comment this line if you want to run the server in test mode
        CARGO_BUILD_FLAGS: "--no-default-features"
        DATA_PATH: "/opt/boum/viva-padel-data"
        DATABASE_URL: "sqlite:///usr/local/share/viva-padel-server/data/viva_padel.db?mode=rwc"
      # no_log: true

    - name: Copy tunnel docker-compose file
      ansible.builtin.copy:
        src: docker-compose.tunnel.yml
        dest: /opt/boum/docker-compose.tunnel.yml

    - name: Deploy cloudflare tunnel
      ansible.builtin.command: docker-compose -f docker-compose.tunnel.yml up -d
      args:
        chdir: /opt/boum
      environment:
        TUNNEL_TOKEN: "{{ vault_tunnel_token }}"
